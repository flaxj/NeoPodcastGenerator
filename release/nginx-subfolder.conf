# Inside your existing HTTPS server block, before generic regex PHP locations.
# Its document root must contain the podcast directory; do not use an alias.
# Set NEO_BASE_PATH to /podcast. Replace /podcast consistently for another path.
location = /podcast { return 301 /podcast/; }
location = /podcast/_neo { return 404; }
location ^~ /podcast/_neo/ { return 404; }
location ~ ^/podcast/(?:.*\/)?\. { return 404; }
location = /podcast/app.css { try_files $uri =404; }
location = /podcast/app.js { try_files $uri =404; }
location = /podcast/index.php {
    client_max_body_size 6m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/podcast/index.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}
location ~* ^/podcast/.*\.(php[0-9]?|phtml|phar)(/|$) { return 404; }
location /podcast/ {
    client_max_body_size 6m;
    autoindex off;
    rewrite ^ /podcast/index.php last;
}

# Inside your HTTPS server block. Adjust root and fastcgi_pass for your host.
root /var/www/podcast;
index index.php;
client_max_body_size 6m;
autoindex off;
location = /_neo { return 404; }
location ^~ /_neo/ { return 404; }
location ~ /\. { return 404; }
location = /app.css { try_files $uri =404; }
location = /app.js { try_files $uri =404; }
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}
location ~* \.(php[0-9]?|phtml|phar)(/|$) { return 404; }
location / { rewrite ^ /index.php last; }

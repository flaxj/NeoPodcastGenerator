name: Validate and publish upload-ready release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yaml run --build --rm test
      - run: bash tests/stack.sh
  shared:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [apache, nginx]
        prefix: ['', '/podcast']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, dom, fileinfo, zip
          tools: composer:2.10.3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist
      - run: php tests/package.php
      - run: find src templates public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test extracted ZIP on web server
        env:
          TEST_SERVER: ${{ matrix.server }}
          TEST_PREFIX: ${{ matrix.prefix }}
        run: bash tests/package-stack.sh "$TEST_SERVER" "$TEST_PREFIX"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shared-logs-${{ matrix.server }}-${{ strategy.job-index }}
          path: test-results/**/*.log
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, shared]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, dom, fileinfo, zip
          tools: composer:2.10.3
      - run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist
      - name: Build upload-ready ZIP and release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          php bin/package.php "$VERSION"
          archive="dist/neo-podcast-generator-${VERSION#v}.zip"
          printf 'Upload-ready PHP application for Apache 2.4 or Nginx/PHP-FPM. Requires PHP 8.4-compatible PHP 8.x, PDO SQLite, DOM, Fileinfo, sessions, HTTPS, and writable local storage.\n\nExtract into your web root or a subfolder, including hidden .htaccess files. Read INSTALL.md before configuration and browser setup; Nginx requires provider/server configuration.\n\nShared hosting: MP3 publishing without Composer, a worker, or FFmpeg on the host. Use Source code for full VPS/server builds. Back up your configuration and data before upgrading.\n\nSHA-256 (also attached as a downloadable file):\n\n```text\n' > dist/notes.md
          cat "$archive.sha256" >> dist/notes.md
          printf '```\n' >> dist/notes.md
          (cd dist && sha256sum --check "$(basename "$archive").sha256")
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          archive="dist/neo-podcast-generator-${VERSION#v}.zip"
          gh release create "$VERSION" "$archive" "$archive.sha256" --verify-tag --title "$VERSION" --notes-file dist/notes.md
          gh release download "$VERSION" --pattern "$(basename "$archive")*" --dir test-results/published
          cmp "$archive" "test-results/published/$(basename "$archive")"
          cmp "$archive.sha256" "test-results/published/$(basename "$archive").sha256"
          (cd test-results/published && sha256sum --check "$(basename "$archive").sha256")
